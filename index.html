        <h1>💰 Finanzas Max</h1>

        <p>Ingresá tu PIN</p>

        <input
            type="password"
            id="pinInput"
            maxlength="6"
            inputmode="numeric"
        >

        <button id="pinButton">
            Continuar
        </button>

    </div>

    <div id="dashboard" class="screen hidden">

        <header>
            <h1>Finanzas Max</h1>
        </header>

        <section class="card">
            <h2>Saldo Total</h2>
            <span id="saldoTotal">$0</span>
        </section>

        <section class="card">
            <h3>ARS</h3>
            <span id="saldoARS">$0</span>
        </section>

        <section class="card">
            <h3>USD</h3>
            <span id="saldoUSD">USD 0</span>
        </section>

        <section class="card">
<section class="card">

    <h3>
        Gastos por Categoría

        <section class="card">

    <h3>
        Gráfico de Gastos
    </h3>

    <canvas
        id="graficoCategorias"
    ></canvas>

</section>

        <section class="card">

    <h3>
        Resumen Mensual
        <section class="card">

    <h3>
        Consejos de Ahorro
        <section class="card">

    <h3>
        Respaldo de Datos
    </h3>

    <button id="btnExportar">
        📤 Exportar Backup
    </button>

    <input
        type="file"
        id="inputImportar"
        accept=".json"
    >

</section>
    </h3>

    <div id="consejosAhorro">

    </div>

</section>
    </h3>

    <div id="resumenMensual">

    </div>

</section>

    <div id="resumenCategorias">

    </div>

</section>

    <select id="tipoMovimiento">
        <option value="ingreso">Ingreso</option>
        <option value="gasto">Gasto</option>
    </select>

    <select id="cuentaMovimiento">
    </select>

    <input
        type="number"
        id="importeMovimiento"
        placeholder="Importe"
    >

    <input
        type="text"
        id="descripcionMovimiento"
        placeholder="Descripción"
    >
    <button id="btnVoz">
    🎤 Registrar por Voz
</button>

<div id="textoReconocido"></div>
    <button id="btnGuardarMovimiento">
        Guardar Movimiento
    </button>

</section>

<section class="card">

    <h3>Últimos movimientos</h3>

    <ul id="movimientos">

</div>
