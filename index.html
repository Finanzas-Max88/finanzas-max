<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Max</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/app.css">
</head>
<script>
console.log("INDEX CORRECTO");
</script>
<body>

<div id="app">

    <div id="pin-screen" class="screen">

        <h1>💰 Finanzas Max</h1>

        <p>Ingresá tu PIN</p>

        <input
            type="password"
            id="pinInput"
            maxlength="6"
            inputmode="numeric"
        >

        <button id="pinButton">
            Continuar
        </button>

    </div>

    <div id="dashboard" class="screen hidden">

    <header>
        <h1>Finanzas Max</h1>
    </header>

    <section class="card">
        <h2>Saldo Total</h2>
        <span id="saldoTotal">$0</span>
    </section>

    <section class="card">
        <h3>ARS</h3>
        <span id="saldoARS">$0</span>
    </section>

    <section class="card">
        <h3>USD</h3>
        <span id="saldoUSD">USD 0</span>
    </section>

    <section class="card">
        <h3>Gastos por Categoría</h3>
        <div id="resumenCategorias"></div>
    </section>

    <section class="card">
        <h3>Gráfico de Gastos</h3>
        <canvas id="graficoCategorias"></canvas>
    </section>

    <section class="card">
        <h3>Resumen Mensual</h3>
        <div id="resumenMensual"></div>
    </section>

    <section class="card">
        <h3>💡 Consejos de Ahorro</h3>
        <div id="consejosAhorro"></div>
    </section>

    <section class="card">
        <h2>🎯 Presupuestos Mensuales</h2>

        <select id="categoriaPresupuesto">
            <option value="Alimentos">Alimentos</option>
            <option value="Combustible">Combustible</option>
            <option value="Servicios">Servicios</option>
            <option value="Suscripciones">Suscripciones</option>
            <option value="Vivienda">Vivienda</option>
            <option value="Otros">Otros</option>
        </select>

        <input
            type="number"
            id="importePresupuesto"
            placeholder="Monto mensual"
        >

        <button id="btnGuardarPresupuesto">
            Guardar Presupuesto
        </button>

        <div id="presupuestosLista"></div>
    </section>

    <section class="card">
        <h3>Respaldo de Datos</h3>

        <button id="btnExportar">
            📤 Exportar Backup
        </button>

        <input
            type="file"
            id="inputImportar"
            accept=".json"
        >
    </section>

    <section class="card">
        <h3>Nuevo Movimiento</h3>

        <select id="tipoMovimiento">
            <option value="ingreso">Ingreso</option>
            <option value="gasto">Gasto</option>
        </select>

        <select id="cuentaMovimiento"></select>

        <input
            type="number"
            id="importeMovimiento"
            placeholder="Importe"
        >

        <input
            type="text"
            id="descripcionMovimiento"
            placeholder="Descripción"
        >

        <button id="btnVoz">
            🎤 Registrar por Voz
        </button>

        <div id="textoReconocido"></div>

        <button id="btnGuardarMovimiento">
            Guardar Movimiento
        </button>
    </section>

    <section class="card">
        <h3>Últimos movimientos</h3>
        <ul id="movimientos"></ul>
    </section>

</div>
<script src="js/database.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
